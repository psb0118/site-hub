<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="여러 사이트를 한곳에서 이동할 수 있는 링크 허브" />
  <meta name="theme-color" content="#070a10" />
  <title>사이트 허브</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='9' width='14' height='14' rx='3' transform='rotate(45 16 16)' fill='%234a7cff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="hub-shell">
    <header class="hub-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span class="brand-diamond"></span></div>
        <div class="brand-text">
          <h1 id="hub-title">SITE HUB</h1>
          <p id="hub-subtitle" class="sub">사이트를 한곳에 모았습니다.</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M16.6 16.6 21 21" />
          </svg>
          <input id="search" type="search" placeholder="사이트 검색…" autocomplete="off" aria-label="사이트 검색" />
          <kbd class="search-kbd">/</kbd>
        </div>
        <div id="account" class="account" hidden></div>
      </div>
    </header>

    <nav id="groups" class="groups" aria-label="카테고리"></nav>

    <main class="hub-main">
      <div id="site-grid" class="site-grid"></div>
      <p id="empty" class="empty hidden">조건에 맞는 사이트가 없습니다.</p>
    </main>

    <footer class="hub-footer">
      <span id="site-count" class="count"></span>
    </footer>
  </div>

  <script src="sites.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
