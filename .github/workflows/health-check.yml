name: 링크·썸네일 점검

on:
  workflow_dispatch:
  schedule:
    # 매일 06:00 KST (21:00 UTC)
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths:
      - "sites.js"
      - "thumbs/**"
      - "scripts/check-health.js"
      - ".github/workflows/health-check.yml"

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  check:
    name: 사이트 링크 · 썸네일 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 점검 실행
        run: node scripts/check-health.js

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md
          if-no-files-found: warn
          retention-days: 30
